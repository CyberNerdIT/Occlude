[project]
name = "occlude"
version = "0.0.3"
description = "Blur immodestly dressed people in videos. Video in, video out."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Anaxonic Labs"}
]
keywords = [
    "video",
    "modesty",
    "blur",
    "privacy",
    "ai",
    "computer-vision",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # VLM modesty judge (Qwen2.5-VL needs a recent transformers + accelerate
    # for device_map). Detector is Ultralytics RT-DETR. SAM2 (silhouette
    # masks) is not on PyPI — install it from source for full quality, or run
    # with --no-sam2 for a feathered-box blur. See the README.
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.49",
    "accelerate>=0.30",
    "ultralytics>=8.3",
    "opencv-python>=4.9",
    "pillow>=10.0",
    "numpy>=1.24",
    "tqdm>=4.65",
    "rich>=13.0.0",
]

[project.urls]
Homepage   = "https://github.com/anaxoniclabs/OCCLUDE"
Repository = "https://github.com/anaxoniclabs/OCCLUDE"
Issues     = "https://github.com/anaxoniclabs/OCCLUDE/issues"

[project.optional-dependencies]
# SAM2 (clean silhouette masks) has no PyPI wheel; install it from source
# when you want full-quality blur shaping:
#   pip install "git+https://github.com/facebookresearch/sam2.git"
# Everything else runs without it (use --no-sam2 for a feathered-box blur).
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.0.0",
    "matplotlib>=3.8",
]

[project.scripts]
occlude = "occlude.cli:main"

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["occlude*"]
exclude = ["tests*", "docs*"]

[tool.bandit]
skips = ["B110", "B404", "B603", "B607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"occlude/cli.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
check_untyped_defs = true
