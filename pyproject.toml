[project]
name = "occlude"
version = "0.0.1"
description = "Blur immodestly dressed people in videos. Video in, video out."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Anaxonic Labs"}
]
keywords = [
    "video",
    "modesty",
    "blur",
    "privacy",
    "ai",
    "computer-vision",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "transformers>=4.40",
    "torch>=2.2",
    "torchvision>=0.17",
    "pillow>=10.0",
    "numpy>=1.24",
    "ultralytics>=8.2",
    "opencv-python>=4.9",
    "insightface>=0.7",
    "onnxruntime>=1.16",
    "scipy>=1.10",
    "tqdm>=4.65",
    "rich>=13.0.0",
]

[project.urls]
Homepage   = "https://github.com/anaxoniclabs/OCCLUDE"
Repository = "https://github.com/anaxoniclabs/OCCLUDE"
Issues     = "https://github.com/anaxoniclabs/OCCLUDE/issues"

[project.optional-dependencies]
# GPU: routes InsightFace's ONNX Runtime sessions onto CUDA and enables
# torchcodec/NVDEC decode on the CUDA fast path. Not a core dependency:
# onnxruntime-gpu has no macOS wheels and would break MPS/CPU installs.
# CUDA users: pip install 'occlude[gpu]'.
gpu = [
    "onnxruntime-gpu>=1.16",
    "torchcodec>=0.4; platform_system != 'Darwin'",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.0.0",
    "matplotlib>=3.8",
]

[project.scripts]
occlude = "occlude.cli:main"

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["occlude*"]
exclude = ["tests*", "docs*"]

[tool.bandit]
skips = ["B110", "B404", "B603", "B607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"occlude/cli.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
check_untyped_defs = true
